name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check scripts src tests
      - run: uv run --locked pytest tests/ --cov=alphacogant --cov-fail-under=90 -q
        env:
          MPLBACKEND: Agg
      - run: uv run --locked alphacogant validate models/alphafund_ewm.md
      - run: uv run --locked python scripts/z_generate_manuscript_variables.py --check
      - run: uv build
      - name: Installed wheel smoke check outside checkout
        shell: bash
        run: |
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "${wheel[0]}" python - <<'PY'
          import alphacogant
          from importlib.metadata import version
          from alphacogant.bridge.gnn import model_from_gnn, model_to_gnn
          assert alphacogant.__version__ == version("alphacogant")
          model_from_gnn(model_to_gnn(alphacogant.default_model()))
          try:
              alphacogant.generate_variables(n=2)
          except FileNotFoundError:
              pass
          else:
              raise AssertionError("Wheel token generation must require manuscript sources")
          PY
  cogant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - name: Verify pinned COGANT matrix parsing and real inference
        run: uv run --with 'cogant @ git+https://github.com/ActiveInferenceInstitute/COGANT.git@5ea2a440bed9cd447e1dd70faae6ce49f0dfee8b#subdirectory=cogant' pytest tests/test_cogant_integration.py -q
