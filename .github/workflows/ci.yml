name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14', '3.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev --no-build-package numpy --no-build-package matplotlib --no-build-package pillow --no-build-package contourpy --no-build-package kiwisolver
      - run: uv run --locked ruff check scripts src tests
      - run: uv run --locked pytest tests/ --cov=alphacogant --cov-fail-under=90 -q
        env:
          MPLBACKEND: Agg
      - run: uv run --locked alphacogant validate models/alphafund_ewm.md
      - run: uv run --locked python scripts/z_generate_manuscript_variables.py --check
      - run: uv run --locked alphacogant doctor --json
      - name: Agent JSONL smoke
        run: echo '{"id":"ci","method":"simulation.run","params":{"horizon":2}}' | uv run --locked alphacogant request
      - name: Profile a bounded workload on Python 3.15
        if: matrix.python == '3.15'
        run: uv run --locked alphacogant profile --samples 3 --n 16 --horizon 8 -o output/profile.json
      - name: Upload Python 3.15 performance evidence
        if: matrix.python == '3.15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-3.15-profile
          path: output/profile.json
      - run: uv build
      - name: Installed wheel smoke check outside checkout
        shell: bash
        run: |
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "${wheel[0]}" python - <<'PY'
          import alphacogant
          from importlib.metadata import version
          from alphacogant.bridge.gnn import model_from_gnn, model_to_gnn
          assert alphacogant.__version__ == version("alphacogant")
          model_from_gnn(model_to_gnn(alphacogant.default_model()))
          from alphacogant.api import Client
          assert Client().call("diagnostics")["healthy"]
          assert Client().call("simulation.run", {"horizon": 2})["summary"]["horizon"] == "2"
          try:
              alphacogant.generate_variables(n=2)
          except FileNotFoundError:
              pass
          else:
              raise AssertionError("Wheel token generation must require manuscript sources")
          PY
  cogant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version-file: ".python-version"
      - run: uv sync --locked --extra dev --no-build-package numpy --no-build-package matplotlib --no-build-package pillow --no-build-package contourpy --no-build-package kiwisolver
      - name: Checkout pinned COGANT without evaluation fixture submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ActiveInferenceInstitute/COGANT
          ref: 5ea2a440bed9cd447e1dd70faae6ce49f0dfee8b
          path: .upstream/COGANT
          submodules: false
          persist-credentials: false
      - name: Verify pinned COGANT matrix parsing and real inference
        run: |
          uv run --with './.upstream/COGANT/cogant' python - <<'PYCODE'
          import cogant
          import pytest
          assert cogant.__version__ == "0.7.0"
          raise SystemExit(pytest.main(["tests/test_cogant_integration.py", "-q"]))
          PYCODE
